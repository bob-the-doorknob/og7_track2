# Tunable pure pursuit baseline for the ICRA 2026 compete centreline.
driver:
  ros__parameters:
    vehicle_ns: /autodrive/roboracer_1
    max_range: 10.0
    centerline_path: ""
    target_speed: 1.8             # [m/s], lower this if the car leaves the line
    max_lateral_accel: 1.5        # [m/s^2], reduces speed in tighter turns
    wheelbase: 0.324              # [m]
    lookahead_min: 0.55            # [m]
    lookahead_max: 1.8             # [m]
    lookahead_speed_gain: 0.35     # [s]
    speed_ff_gain: 0.16
    speed_kp: 0.24
    speed_ki: 0.08
    baseline_only: true
