# Tunable pure pursuit baseline for the ICRA 2026 compete centreline.
driver:
  ros__parameters:
    vehicle_ns: /autodrive/roboracer_1
    max_range: 10.0
    centerline_path: ""
    target_speed: 3.0             # [m/s] straight-line ceiling; profile slows for bends
    max_lateral_accel: 1.5        # [m/s^2], reduces speed in tighter turns
    max_braking_decel: 2.0        # [m/s^2], plans braking before each bend
    wheelbase: 0.324              # [m]
    lookahead_min: 0.55            # [m]
    lookahead_max: 1.8             # [m]
    lookahead_speed_gain: 0.35     # [s]
    speed_ff_gain: 0.16
    speed_kp: 0.24
    speed_ki: 0.08
    baseline_only: true
    policy_path: ""               # .npz path; used only when baseline_only is false
    safety_enabled: true
    safety_side_margin: 0.08      # [m] added to the 0.135 m car half-width
    safety_stop_margin: 0.25      # [m] bumper and uncertainty allowance
    safety_max_deceleration: 2.0  # [m/s^2] conservative braking limit
    safety_horizon: 3.0           # [m] scanned path length
