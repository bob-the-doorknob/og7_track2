# Experimental faster straight candidate. 9 m/s is a requested test value,
# not a known motor limit or a permanent cap. The map certifies the racing
# line before the 10 m LiDAR's clear-horizon cap may be lifted on a straight.
driver:
  ros__parameters:
    vehicle_ns: /autodrive/roboracer_1
    max_range: 10.0
    centerline_path: ""
    vehicle_limits_path: packaged
    planning_lateral_mps2: 7.0
    planning_top_speed_mps: 9.0
    map_guard_path: packaged
    wheelbase: 0.324
    lookahead_min: 0.55
    lookahead_max: 1.8
    lookahead_speed_gain: 0.35
    speed_ff_gain: 0.16
    speed_kp: 0.24
    speed_ki: 0.08
    baseline_only: true
    policy_path: ""
    safety_enabled: true
    safety_side_margin: 0.08
    safety_stop_margin: 0.25
    safety_max_deceleration: 2.0
    safety_horizon: 10.0
